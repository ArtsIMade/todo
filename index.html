<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo for Mom</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <h1>Todo for Mom</h1>
  <main>
    <form id="add-task">
      <label for="task-description">New task</label>
      <div class="task-entry">
        <input id="task-description" type="text" required>
        <button type="submit">Add</button>
      </div>
    </form>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="urgent" aria-pressed="false">Urgent</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="done" aria-pressed="false">Done</button>
    </div>
    <p id="task-count" role="status"></p>
    <p id="empty-message"></p>
    <ul id="task-list" aria-label="Tasks"></ul>
  </main>
</body>
</html>
